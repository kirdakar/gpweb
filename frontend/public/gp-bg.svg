<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="0.55" stop-color="#a9d6f5"/>
      <stop offset="1" stop-color="#fde9c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffe08a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fca5c"/>
      <stop offset="1" stop-color="#4f9a3a"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6d95a"/>
      <stop offset="1" stop-color="#6fae3f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc4e8"/>
      <stop offset="1" stop-color="#4c9fd0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="1" stop-color="#f2dfba"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1280" cy="190" r="230" fill="url(#sun)"/>
  <circle cx="1280" cy="190" r="62" fill="#fff3bf"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="260" cy="150" rx="120" ry="30"/><ellipse cx="330" cy="130" rx="80" ry="34"/><ellipse cx="200" cy="135" rx="70" ry="28"/>
    <ellipse cx="820" cy="95" rx="140" ry="26"/><ellipse cx="900" cy="78" rx="80" ry="30"/><ellipse cx="750" cy="85" rx="70" ry="24"/>
    <ellipse cx="1450" cy="330" rx="110" ry="24" opacity="0.8"/><ellipse cx="1510" cy="316" rx="60" ry="24" opacity="0.8"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#3b4b5a" stroke-width="2.4" stroke-linecap="round">
    <path d="M520 210 q12 -14 24 0 q12 -14 24 0"/><path d="M600 170 q10 -12 20 0 q10 -12 20 0"/><path d="M470 150 q9 -10 18 0 q9 -10 18 0"/>
    <path d="M1040 120 q10 -12 20 0 q10 -12 20 0"/>
  </g>

  <!-- distant hills -->
  <path d="M0 470 Q160 380 330 440 T640 430 T980 420 T1300 440 T1600 400 L1600 560 L0 560Z" fill="#9bbfd8" opacity="0.75"/>
  <path d="M0 520 Q200 450 420 505 T820 490 T1200 500 T1600 470 L1600 600 L0 600Z" fill="#7fae9a" opacity="0.9"/>

  <!-- far fields -->
  <path d="M0 560 Q400 520 800 550 T1600 540 L1600 900 L0 900Z" fill="url(#field2)"/>
  <g stroke="#8dbd48" stroke-width="2" opacity="0.55">
    <path d="M0 585 Q400 552 800 578 T1600 568"/><path d="M0 605 Q400 572 800 598 T1600 588"/>
    <path d="M0 625 Q400 592 800 618 T1600 608"/>
  </g>

  <!-- river -->
  <path d="M-20 680 Q300 640 620 690 T1240 700 T1640 660 L1640 720 Q1240 760 620 740 T-20 730Z" fill="url(#river)" opacity="0.95"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <path d="M200 700 q30 -6 60 0"/><path d="M520 712 q30 -6 60 0"/><path d="M900 716 q30 -6 60 0"/><path d="M1300 700 q30 -6 60 0"/>
  </g>

  <!-- near ground -->
  <path d="M0 720 Q400 690 800 715 T1600 700 L1600 900 L0 900Z" fill="url(#field1)"/>

  <!-- village houses (left) -->
  <g>
    <rect x="70" y="520" width="120" height="80" fill="#f3d9a4"/><path d="M55 522 L130 468 L205 522Z" fill="#c1583a"/><rect x="112" y="550" width="28" height="50" fill="#8a5a36"/><rect x="152" y="545" width="22" height="20" fill="#7cb7dc"/>
    <rect x="230" y="540" width="100" height="66" fill="#e7f0d8"/><path d="M218 542 L280 496 L342 542Z" fill="#b4462f"/><rect x="264" y="566" width="24" height="40" fill="#8a5a36"/>
    <rect x="360" y="548" width="90" height="60" fill="#f7e1b5"/><path d="M350 550 L405 508 L460 550Z" fill="#c1583a"/><rect x="392" y="572" width="22" height="36" fill="#8a5a36"/>
  </g>
  <!-- village houses (right) -->
  <g>
    <rect x="1130" y="530" width="110" height="74" fill="#f6dcae"/><path d="M1116 532 L1185 484 L1254 532Z" fill="#b4462f"/><rect x="1172" y="560" width="26" height="44" fill="#8a5a36"/>
    <rect x="1290" y="540" width="120" height="68" fill="#e9f1da"/><path d="M1276 542 L1350 494 L1424 542Z" fill="#c1583a"/><rect x="1336" y="568" width="26" height="40" fill="#8a5a36"/>
    <rect x="1450" y="552" width="90" height="58" fill="#f3d9a4"/><path d="M1440 554 L1495 512 L1550 554Z" fill="#b4462f"/>
  </g>

  <!-- Gram Panchayat building (centre) -->
  <g>
    <ellipse cx="800" cy="640" rx="330" ry="22" fill="#000" opacity="0.12"/>
    <rect x="590" y="600" width="420" height="24" fill="#d8c9a6"/>
    <rect x="610" y="588" width="380" height="16" fill="#e6d8b5"/>
    <rect x="630" y="440" width="340" height="150" fill="url(#wall)"/>
    <rect x="630" y="440" width="340" height="14" fill="#e08a2e"/>
    <rect x="630" y="580" width="340" height="10" fill="#b9a982"/>
    <!-- side wings -->
    <rect x="560" y="490" width="80" height="100" fill="url(#wall)"/><rect x="560" y="480" width="80" height="12" fill="#e08a2e"/>
    <rect x="960" y="490" width="80" height="100" fill="url(#wall)"/><rect x="960" y="480" width="80" height="12" fill="#e08a2e"/>
    <!-- portico -->
    <path d="M700 440 L800 372 L900 440Z" fill="#f4e6c6" stroke="#d9c79c" stroke-width="3"/>
    <!-- rooftop water tank (यावर "ग्रामपंचायत" लिहिले जाते) + flag -->
    <rect x="700" y="360" width="200" height="12" fill="#8a7a58"/>
    <rect x="722" y="350" width="12" height="12" fill="#8a7a58"/><rect x="866" y="350" width="12" height="12" fill="#8a7a58"/>
    <rect x="690" y="298" width="220" height="62" rx="14" fill="#2f7fc1" stroke="#1d5a91" stroke-width="4"/>
    <rect x="690" y="298" width="220" height="10" rx="5" fill="#5aa7e0"/>
    <path d="M690 298 Q800 262 910 298Z" fill="#e6902f" stroke="#b96f1d" stroke-width="3"/>
    <rect x="797" y="176" width="7" height="94" fill="#7a5a2e"/><circle cx="800.5" cy="174" r="5" fill="#e6b73c"/>
    <rect x="804" y="179" width="64" height="13" fill="#ff9933"/><rect x="804" y="192" width="64" height="13" fill="#ffffff"/><rect x="804" y="205" width="64" height="13" fill="#138808"/>
    <rect x="804" y="179" width="64" height="39" fill="none" stroke="#5b4a2a" stroke-width="1.5"/>
    <circle cx="836" cy="198.5" r="5" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
    <!-- pillars -->
    <g fill="#fffaf0" stroke="#d9c79c" stroke-width="2">
      <rect x="712" y="440" width="16" height="150"/><rect x="756" y="440" width="16" height="150"/>
      <rect x="828" y="440" width="16" height="150"/><rect x="872" y="440" width="16" height="150"/>
    </g>
    <!-- door -->
    <path d="M776 590 V520 Q800 494 824 520 V590Z" fill="#7a4a2a"/><path d="M800 500 V590" stroke="#5c341c" stroke-width="2"/>
    <!-- windows -->
    <g fill="#8ec5e8" stroke="#7a5b34" stroke-width="3">
      <rect x="648" y="480" width="40" height="56"/><rect x="912" y="480" width="40" height="56"/>
      <rect x="578" y="510" width="44" height="52"/><rect x="978" y="510" width="44" height="52"/>
    </g>
    <path d="M668 480 V536 M648 508 H688 M932 480 V536 M912 508 H952 M600 510 V562 M578 536 H622 M1000 510 V562 M978 536 H1022" stroke="#7a5b34" stroke-width="2"/>
    <!-- signboard -->
    <rect x="690" y="452" width="220" height="0" fill="none"/>
    <!-- steps -->
    <rect x="720" y="606" width="160" height="10" fill="#cdbb92"/><rect x="740" y="616" width="120" height="8" fill="#c2af86"/>
  </g>

  <!-- path to building -->
  <path d="M770 628 L830 628 L980 760 L620 760Z" fill="#dcc79a" opacity="0.9"/>

  <!-- trees -->
  <g>
    <rect x="503" y="500" width="14" height="110" fill="#6b4a2b"/>
    <circle cx="510" cy="470" r="52" fill="#3f8f3a"/><circle cx="470" cy="500" r="40" fill="#4aa043"/><circle cx="552" cy="502" r="40" fill="#36822f"/><circle cx="510" cy="430" r="34" fill="#4aa043"/>
    <rect x="1092" y="504" width="14" height="106" fill="#6b4a2b"/>
    <circle cx="1099" cy="474" r="50" fill="#3f8f3a"/><circle cx="1060" cy="504" r="38" fill="#4aa043"/><circle cx="1140" cy="506" r="38" fill="#36822f"/><circle cx="1099" cy="436" r="32" fill="#4aa043"/>
    <rect x="30" y="560" width="10" height="70" fill="#6b4a2b"/><circle cx="35" cy="540" r="34" fill="#3f8f3a"/><circle cx="8" cy="562" r="26" fill="#4aa043"/>
    <rect x="1562" y="560" width="10" height="70" fill="#6b4a2b"/><circle cx="1567" cy="540" r="34" fill="#3f8f3a"/><circle cx="1592" cy="562" r="26" fill="#4aa043"/>
  </g>

  <!-- foreground crops -->
  <g stroke="#3f8a34" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M0 800 Q400 770 800 795 T1600 780"/><path d="M0 830 Q400 800 800 825 T1600 810"/><path d="M0 860 Q400 830 800 855 T1600 840"/>
  </g>
  <!-- marigold flowers -->
  <g fill="#f5a623">
    <circle cx="140" cy="812" r="7"/><circle cx="220" cy="842" r="6"/><circle cx="330" cy="818" r="7"/><circle cx="460" cy="850" r="6"/>
    <circle cx="1180" cy="822" r="7"/><circle cx="1290" cy="848" r="6"/><circle cx="1400" cy="816" r="7"/><circle cx="1500" cy="846" r="6"/>
  </g>
</svg>
