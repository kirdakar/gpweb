# gpweb - XAMPP Apache कॉन्फिग (Oracle ची .ora फाईल XAMPP/MariaDB मध्ये नसते; Apache मध्ये त्याच कामाची
# फाईल .conf असते).
#
# ही फाईल  C:\xampp\apache\conf\extra\gpweb.conf  येथे ठेवा आणि  C:\xampp\apache\conf\httpd.conf  च्या
# शेवटी ही एक ओळ जोडा:
#       Include conf/extra/gpweb.conf
# तसेच httpd.conf मध्ये खालील ४ ओळींच्या आधीचा # (कमेंट) काढा (mod_headers साधारणपणे आधीच चालू
# असतो, पण नसल्यास तोही चालू करा):
#       LoadModule proxy_module modules/mod_proxy.so
#       LoadModule proxy_http_module modules/mod_proxy_http.so
#       LoadModule rewrite_module modules/mod_rewrite.so
#       LoadModule headers_module modules/mod_headers.so
#
# frontend (React build) येथून चालते:  C:\xampp\htdocs\gpweb   (deploy\build-and-deploy.bat कॉपी करतो)
# /api ची सर्व विनंती आतल्या Node backend ला (127.0.0.1:4000) जाते.
# Cloudflare Tunnel हा  http://localhost:8090  ला जोडायचा आहे.

Listen 8090

<VirtualHost *:8090>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/gpweb"

    <Directory "C:/xampp/htdocs/gpweb">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # React Router: /login, /gp1to33/... इत्यादी थेट उघडल्यास index.html द्या
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]

        # ब्राउझर कायम जुनेच पान दाखवत राहण्याची अडचण (नवीन build टाकूनही Ctrl+F5 शिवाय
        # जुनाच कोड दिसणे) टाळण्यासाठी: index.html कधीही ब्राउझरमध्ये साठवू (cache) देत नाही
        # - प्रत्येक वेळी सर्व्हरकडून ताजेच मागवले जाते. assets/ मधील index-XXXX.js/css फाईल्सचे
        # नाव प्रत्येक build ला बदलते (content hash), त्यामुळे त्या मात्र कायमस्वरूपी cache करणे
        # सुरक्षित व वेगवान आहे.
        <IfModule mod_headers.c>
            <FilesMatch "\.html$">
                Header set Cache-Control "no-store, no-cache, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(js|css)$">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
        </IfModule>
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    # बॅकअप/रि-स्टोअर मधील मोठ्या .sql फाईलसाठी (200 MB)
    LimitRequestBody 209715200

    ErrorLog  "logs/gpweb-error.log"
    CustomLog "logs/gpweb-access.log" common
</VirtualHost>
