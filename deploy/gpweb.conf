# gpweb - XAMPP Apache कॉन्फिग (Oracle ची .ora फाईल XAMPP/MariaDB मध्ये नसते; Apache मध्ये त्याच कामाची
# फाईल .conf असते).
#
# ही फाईल  C:\xampp\apache\conf\extra\gpweb.conf  येथे ठेवा आणि  C:\xampp\apache\conf\httpd.conf  च्या
# शेवटी ही एक ओळ जोडा:
#       Include conf/extra/gpweb.conf
# तसेच httpd.conf मध्ये खालील ३ ओळींच्या आधीचा # (कमेंट) काढा:
#       LoadModule proxy_module modules/mod_proxy.so
#       LoadModule proxy_http_module modules/mod_proxy_http.so
#       LoadModule rewrite_module modules/mod_rewrite.so
#
# frontend (React build) येथून चालते:  C:\xampp\htdocs\gpweb   (deploy\build-and-deploy.bat कॉपी करतो)
# /api ची सर्व विनंती आतल्या Node backend ला (127.0.0.1:4000) जाते.
# Cloudflare Tunnel हा  http://localhost:8080  ला जोडायचा आहे.

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/gpweb"

    <Directory "C:/xampp/htdocs/gpweb">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # React Router: /login, /gp1to33/... इत्यादी थेट उघडल्यास index.html द्या
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    # बॅकअप/रि-स्टोअर मधील मोठ्या .sql फाईलसाठी (200 MB)
    LimitRequestBody 209715200

    ErrorLog  "logs/gpweb-error.log"
    CustomLog "logs/gpweb-access.log" common
</VirtualHost>
